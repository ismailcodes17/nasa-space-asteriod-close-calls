services:
  db:
    image: postgres:18.4-alpine
    container_name: space-close-calls-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cosmic
      POSTGRES_USER:  cosmic
      POSTGRES_PASSWORD: local_development_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U cosmic -d cosmic"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

